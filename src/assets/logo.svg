  <path d="M80 55H88" stroke="white" stroke-width="2" stroke-linecap="round"/>
  <path d="M88 55L92 59" stroke="white" stroke-width="2" stroke-linecap="round"/>
  
  <!-- Орбита и точки (слева сверху) -->
  <path d="M20 30A30 30 0 1 1 50 0" stroke="white" stroke-width="2" fill="none" stroke-dasharray="5 5"/>
  <circle cx="20" cy="30" r="3" fill="white"/>
  <circle cx="35" cy="15" r="3" fill="white"/>
</svg>
