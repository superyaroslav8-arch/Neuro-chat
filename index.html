<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Нейро-чат</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- Экран входа -->
  <div id="login-screen" class="screen">
    <div class="login-box">
      <div class="logo-text">Нейро-чат</div>
      <p class="subtitle">Умный помощник</p>

      <div id="step-username">
        <input type="text" id="username" placeholder="Имя пользователя" autocomplete="username">
        <button onclick="nextStep()">Далее</button>
      </div>

      <div id="step-password" style="display:none;">
        <input type="password" id="password" placeholder="Пароль" autocomplete="current-password">
        <button onclick="login()">Войти</button>
        <button class="secondary" onclick="backToUsername()">Назад</button>
      </div>
    </div>
  </div>

  <!-- Основной интерфейс -->
  <div id="app" class="screen" style="display:none;">
    <!-- Боковое меню -->
    <div id="sidebar" class="sidebar">
      <div class="sidebar-header">
        <span class="sidebar-logo-text">Н</span>
        <span>Нейро-чат</span>
      </div>

      <nav>
        <a href="#" class="nav-item active"><span class="icon">💬</span> Чат</a>
        <a href="#" class="nav-item"><span class="icon">📚</span> Библиотека</a>
        <a href="#" class="nav-item"><span class="icon">📁</span> Проекты</a>
        <a href="#" class="nav-item"><span class="icon">🔌</span> Плагины</a>
        <a href="#" class="nav-item"><span class="icon">⏰</span> Запланированные</a>
        <a href="#" class="nav-item"><span class="icon">⋯</span> Больше</a>
      </nav>

      <div class="sidebar-section">
        <div class="section-title">Закреплено</div>
        <div class="chat-item">3 бойца</div>
        <div class="chat-item">Стикеры «3D гусь»</div>
      </div>

      <div class="sidebar-section">
        <div class="section-title">Недавнее</div>
        <div class="chat-item">Редактирование ТЗ сайта</div>
        <div class="chat-item">Ежедневные фото для кан...</div>
        <div class="chat-item">Поиск Airwheel SE3S</div>
        <div class="chat-item">Где взять ключ</div>
      </div>

      <div class="sidebar-footer">
        <button onclick="openSupport()">📞 Поддержка</button>
        <button onclick="openSettings()">⚙️ Настройки</button>
        <button onclick="logout()" class="logout">Выйти</button>
      </div>
    </div>

    <!-- Основная область чата -->
    <div class="main">
      <div class="top-bar">
        <button class="menu-btn" onclick="toggleSidebar()">☰</button>
        <div class="chat-title" id="chat-title">Временный чат</div>
        <div class="top-actions">
          <button onclick="newChat()">＋</button>
        </div>
      </div>

      <div
