<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#08090c">
<title>Нейро-чат</title>

<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden}
body{
font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display",Inter,Arial,sans-serif;
background:#08090c;color:#f5f5f7
}
button,input,textarea{font:inherit}
button{cursor:pointer}
.app{height:100dvh;display:flex}

.sidebar{
width:280px;flex-shrink:0;background:#0d0e12;
border-right:1px solid #24252b;padding:14px;
display:flex;flex-direction:column;gap:12px
}
.logo{display:flex;align-items:center;gap:10px;padding:8px;font-weight:700}
.logoIcon{
width:34px;height:34px;border-radius:11px;background:#fff;color:#000;
display:grid;place-items:center;font-weight:900
}
.new{
height:45px;border:0;border-radius:12px;background:#fff;color:#000;font-weight:700
}
.chatList{flex:1;overflow:auto}
.chat{
display:flex;align-items:center;gap:8px;padding:11px;border-radius:10px;
color:#ccc;margin-bottom:3px;cursor:pointer
}
.chat:hover,.chat.active{background:#202126;color:#fff}
.chatName{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.deleteChat{
background:none;color:#777;border:0;font-size:18px
}
.account{
border:0;border-top:1px solid #24252b;background:none;color:#ddd;
padding:14px 7px;display:flex;align-items:center;gap:10px;text-align:left
}
.avatar{
width:32px;height:32px;border-radius:50%;background:#292a30;
display:grid;place-items:center;font-weight:700
}

.main{flex:1;min-width:0;height:100%;display:flex;flex-direction:column}
.header{
height:62px;flex-shrink:0;border-bottom:1px solid #222329;
display:flex;align-items:center;justify-content:space-between;padding:0 16px;
background:rgba(10,11,14,.8);backdrop-filter:blur(20px)
}
.headerTitle{font-weight:700}
.headerButtons{display:flex;gap:5px}
.icon{
width:38px;height:38px;border:0;border-radius:10px;background:transparent;
color:#bbb;font-size:18px
}
.icon:hover{background:#202126;color:#fff}
.mobileMenu{display:none}

.messages{
flex:1;overflow-y:auto;padding:25px 15px 150px
}
.messagesInner{max-width:850px;margin:auto}
.welcome{
min-height:calc(100vh - 250px);
display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center
}
.welcomeIcon{
width:65px;height:65px;border-radius:20px;background:#fff;color:#000;
display:grid;place-items:center;font-size:28px;font-weight:900;margin-bottom:20px
}
.welcome h1{margin:0 0 8px;font-size:38px}
.welcome p{color:#888;margin:0}
.cards{
display:grid;grid-template-columns:1fr 1fr;gap:10px;
width:min(650px,100%);margin-top:25px
}
.card{
border:1px solid #292a30;background:#111217;color:#ccc;
padding:14px;border-radius:13px;text-align:left
}
.card:hover{background:#1b1c21}

.message{display:flex;gap:12px;margin-bottom:25px}
.messageAvatar{
width:34px;height:34px;min-width:34px;border-radius:10px;
background:#25262c;display:grid;place-items:center;font-weight:700
}
.messageBody{min-width:0;flex:1}
.role{font-size:13px;font-weight:700;margin:3px 0 7px}
.content{
font-size:15px;line-height:1.65;color:#ddd;overflow-wrap:anywhere
}
.content pre{
background:#0b0c0f;border:1px solid #292a30;border-radius:12px;
padding:13px;overflow:auto
}
.content code{font-family:monospace}
.media{
max-width:100%;max-height:450px;border-radius:14px;margin-top:8px;
border:1px solid #292a30
}

.composerArea{
position:absolute;left:0;right:0;bottom:0;padding:12px 15px 18px;
background:linear-gradient(transparent,#08090c 30%)
}
.composer{
max-width:850px;margin:auto;background:#1a1b20;border:1px solid #303138;
border-radius:18px;overflow:hidden
}
.preview{display:none;padding:10px}
.preview.show{display:block}
.previewItem{
display:flex;align-items:center;gap:8px;background:#25262c;
border-radius:10px;padding:8px;color:#ccc;font-size:13px
}
.textarea{
width:100%;border:0;outline:0;resize:none;min-height:55px;max-height:180px;
padding:15px;background:none;color:#fff;font-size:15px
}
.textarea::placeholder{color:#777}
.bottom{
height:48px;display:flex;align-items:center;justify-content:space-between;padding:0 8px
}
.leftButtons{display:flex;gap:3px}
.tool{
height:36px;min-width:36px;padding:0 10px;border:0;border-radius:10px;
background:transparent;color:#aaa;font-size:18px
}
.tool:hover{background:#292a30;color:#fff}
.send{
width:38px;height:38px;border:0;border-radius:11px;background:#fff;color:#000;
font-size:19px;font-weight:700
}
.send:disabled{opacity:.35}

.modal{
display:none;position:fixed;inset:0;background:rgba(0,0,0,.7);
backdrop-filter:blur(12px);z-index:100;align-items:center;justify-content:center;padding:15px
}
.modal.show{display:flex}
.box{
width:min(440px,100%);background:#18191f;border:1px solid #303138;
border-radius:20px;padding:20px
}
.box h2{margin:0 0 17px}
.close{
float:right;border:0;background:none;color:#aaa;font-size:24px
}
.field{margin-bottom:12px}
.field label{display:block;color:#aaa;font-size:12px;margin-bottom:6px}
.field input,.field textarea,.field select{
width:100%;border:1px solid #303138;background:#0d0e12;color:#fff;
border-radius:11px;padding:12px;outline:0
}
.primary{
width:100%;height:45px;border:0;border-radius:11px;background:#fff;color:#000;font-weight:700
}
.secondary{
width:100%;height:44px;border:0;border-radius:11px;background:#292a30;color:#fff;margin-top:8px
}
.error{
display:none;background:#351b1b;color:#ff817c;padding:9px;border-radius:9px;
font-size:12px;margin-bottom:10px
}
.error.show{display:block}

@media(max-width:760px){
.sidebar{
position:fixed;top:0;bottom:0;left:0;z-index:90;
transform:translateX(-105%);transition:.2s
}
.sidebar.open{transform:translateX(0)}
.mobileMenu{display:block}
.header{padding:0 9px}
.cards{grid-template-columns:1fr}
.welcome h1{font-size:30px}
.messages{padding-left:10px;padding-right:10px}
}
</style>
</head>

<body>
<div class="app">

<aside class="sidebar" id="sidebar">
<div class="logo">
<div class="logoIcon">N</div>
<span>Нейро-чат</span>
</div>

<button class="new" id="newChat">＋ Новый чат</button>

<div class="chatList" id="chatList"></div>

<button class="account" id="account">
<div class="avatar" id="avatar">?</div>
<span id="accountName">Войти</span>
</button>
</aside>

<main class="main">

<header class="header">
<div style="display:flex;align-items:center;gap:8px">
<button class="icon mobileMenu" id="mobileMenu">☰</button>
<div class="headerTitle">Нейро-чат</div>
</div>

<div class="headerButtons">
<button class="icon" id="imageOpen" title="Изображение">▧</button>
<button class="icon" id="videoOpen" title="Видео">▶</button>
</div>
</header>

<section class="messages" id="messages">
<div class="messagesInner" id="messagesInner"></div>
</section>

<div class="composerArea">
<div class="composer">

<div class="preview" id="preview"></div>

<textarea
class="textarea"
id="input"
placeholder="Напишите сообщение..."
rows="1"></textarea>

<div class="bottom">
<div class="leftButtons">

<button class="tool" id="plus" title="Добавить медиа">＋</button>

<input
id="fileInput"
type="file"
hidden
accept="image/*,video/*,audio/*">

</div>

<button class="send" id="send">↑</button>
</div>
</div>
</div>

</main>
</div>


<!-- AUTH -->

<div class="modal" id="authModal">
<div class="box">
<button class="close" data-close="authModal">×</button>
<h2 id="authTitle">Вход</h2>

<div class="error" id="authError"></div>

<div class="field">
<label>Имя пользователя</label>
<input id="username" autocomplete="username">
</div>

<div class="field">
<label>Пароль</label>
<input id="password" type="password" autocomplete="current-password">
</div>

<button class="primary" id="authSubmit">Войти</button>

<button class="secondary" id="authSwitch">
Создать аккаунт
</button>
</div>
</div>


<!-- PROFILE -->

<div class="modal" id="profileModal">
<div class="box">
<button class="close" data-close="profileModal">×</button>
<h2>Аккаунт</h2>
<button class="primary" id="logout">Выйти</button>
</div>
</div>


<!-- IMAGE -->

<div class="modal" id="imageModal">
<div class="box">
<button class="close" data-close="imageModal">×</button>
<h2>Создать изображение</h2>

<div class="field">
<textarea id="imagePrompt" rows="5"
placeholder="Опишите изображение..."></textarea>
</div>

<button class="primary" id="generateImage">Создать</button>

<div id="imageResult" style="margin-top:14px"></div>
</div>
</div>


<!-- VIDEO -->

<div class="modal" id="videoModal">
<div class="box">
<button class="close" data-close="videoModal">×</button>
<h2>Создать видео</h2>

<div class="field">
<textarea id="videoPrompt" rows="5"
placeholder="Опишите видео..."></textarea>
</div>

<div class="field">
<label>Длительность</label>
<select id="videoDuration">
<option value="5">5 секунд</option>
<option value="10">10 секунд</option>
<option value="15">15 секунд</option>
</select>
</div>

<button class="primary" id="generateVideo">Создать</button>

<div id="videoResult" style="margin-top:14px"></div>
</div>
</div>


<script>
"use strict";

const $ = id => document.getElementById(id);

const state = {
  user:null,
  chats:[],
  activeChat:null,
  messages:[],
  authMode:"login",
  file:null,
  sending:false
};


/* API */

async function api(url, options={}){
  const response = await fetch(url,{
    credentials:"include",
    ...options,
    headers:{
      "Content-Type":"application/json",
      ...(options.headers||{})
    }
  });

  const text = await response.text();

  let data={};

  if(text){
    try{
      data=JSON.parse(text);
    }catch{
      throw new Error("Сервер вернул некорректный ответ.");
    }
  }

  if(!response.ok){
    throw new Error(
      data.error ||
      data.message ||
      `Ошибка сервера: ${response.status}`
    );
  }

  return data;
}


/* MODALS */

function open(id){
  $(id).classList.add("show");
}

function close(id){
  $(id).classList.remove("show");
}

document.querySelectorAll("[data-close]").forEach(b=>{
  b.onclick=()=>close(b.dataset.close);
});


/* AUTH */

$("account").onclick=()=>{
  if(state.user){
    open("profileModal");
  }else{
    setAuthMode("login");
    open("authModal");
  }
};

function setAuthMode(mode){
  state.authMode=mode;

  $("authTitle").textContent =
    mode==="login" ? "Вход" : "Создание аккаунта";

  $("authSubmit").textContent =
    mode==="login" ? "Войти" : "Создать аккаунт";

  $("authSwitch").textContent =
    mode==="login" ? "Создать аккаунт" : "Уже есть аккаунт?";

  $("authError").classList.remove("show");
}

$("authSwitch").onclick=()=>{
  setAuthMode(
    state.authMode==="login" ? "register" : "login"
  );
};

$("authSubmit").onclick=async()=>{
  const username=$("username").value.trim();
  const password=$("password").value;

  if(username.length<3){
    return authError("Имя пользователя: минимум 3 символа.");
  }

  if(password.length<6){
    return authError("Пароль: минимум 6 символов.");
  }

  const button=$("authSubmit");
  button.disabled=true;

  try{
    const data=await api(
      state.authMode==="login"
        ? "/api/auth/login"
        : "/api/auth/register",
      {
        method:"POST",
        body:JSON.stringify({username,password})
      }
    );

    state.user=data.user || data.account || data;

    close("authModal");
    updateAccount();

    await loadChats();

  }catch(e){
    authError(e.message);
  }finally{
    button.disabled=false;
  }
};

function authError(text){
  $("authError").textContent=text;
  $("authError").classList.add("show");
}

function updateAccount(){
  if(!state.user){
    $("accountName").textContent="Войти";
    $("avatar").textContent="?";
    return;
  }

  const name=state.user.username || "Пользователь";

  $("accountName").textContent=name;
  $("avatar").textContent=name[0].toUpperCase();
}


/* SESSION */

async function checkSession(){
  try{
    const data=await api("/api/auth/me");

    if(data.user){
      state.user=data.user;
      updateAccount();
      await loadChats();
    }else{
      renderWelcome();
    }
  }catch{
    renderWelcome();
  }
}


/* CHATS */

async function loadChats(){
  const data=await api("/api/chats");

  state.chats=
    Array.isArray(data)
      ? data
      : data.chats || [];

  renderChats();

  if(state.chats.length){
    await openChat(state.chats[0].id);
  }else{
    renderWelcome();
  }
}

function renderChats(){
  const list=$("chatList");
  list.innerHTML="";

  state.chats.forEach(chat=>{
    const row=document.createElement("div");
    row.className="chat"+
      (String(chat.id)===String(state.activeChat)?" active":"");

    const name=document.createElement("span");
    name.className="chatName";
    name.textContent=chat.title || "Новый чат";

    const del=document.createElement("button");
    del.className="deleteChat";
    del.textContent="×";

    row.append(name,del);

    row.onclick=()=>openChat(chat.id);

    del.onclick=async e=>{
      e.stopPropagation();

      if(!confirm("Удалить чат?"))return;

      await api(
        "/api/chats/"+encodeURIComponent(chat.id),
        {method:"DELETE"}
      );

      await loadChats();
    };

    list.appendChild(row);
  });
}

$("newChat").onclick=async()=>{
  if(!state.user){
    open("authModal");
    return;
  }

  const data=await api("/api/chats",{
    method:"POST",
    body:JSON.stringify({title:"Новый чат"})
  });

  const chat=data.chat || data;

  state.chats.unshift(chat);

  renderChats();

  await openChat(chat.id);
};

async function openChat(id){
  state.activeChat=id;

  renderChats();

  const data=await api(
    "/api/chats/"+encodeURIComponent(id)+"/messages"
  );

  state.messages=
    Array.isArray(data)
      ? data
      : data.messages || [];

  renderMessages();

  $("sidebar").classList.remove("open");
}


/* MESSAGES */

function escape(text){
  return String(text||"")
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;");
}

function format(text){
  let x=escape(text);

  x=x.replace(
    /```([\s\S]*?)```/g,
    "<pre><code>$1</code></pre>"
  );

  x=x.replace(/\*\*(.*?)\*\*/g,"<strong>$1</strong>");
  x=x.replace(/`([^`]+)`/g,"<code>$1</code>");
  x=x.replace(/\n/g,"<br>");

  return x;
}

function renderWelcome(){
  $("messagesInner").innerHTML=`
    <div class="welcome">
      <div class="welcomeIcon">N</div>
      <h1>Чем я могу помочь?</h1>
      <p>Задайте вопрос Нейро-чату</p>

      <div class="cards">
        <button class="card" data-prompt="Объясни мне сложную тему простыми словами.">
          💡 Объясни сложную тему
        </button>

        <button class="card" data-prompt="Придумай интересную идею для проекта.">
          🚀 Придумай идею
        </button>

        <button class="card" data-prompt="Напиши красивое описание товара.">
          ✍️ Напиши описание
        </button>

        <button class="card" data-prompt="Составь подробный план действий.">
          📋 Составь план
        </button>
      </div>
    </div>
  `;

  document.querySelectorAll("[data-prompt]").forEach(b=>{
    b.onclick=()=>{
      $("input").value=b.dataset.prompt;
      resize();
      $("input").focus();
    };
  });
}

function renderMessages(){
  const root=$("messagesInner");
  root.innerHTML="";

  if(!state.messages.length){
    renderWelcome();
    return;
  }

  state.messages.forEach(m=>{
    const article=document.createElement("div");
    article.className="message";

    const avatar=document.createElement("div");
    avatar.className="messageAvatar";
    avatar.textContent=m.role==="user"?"Я":"N";

    const body=document.createElement("div");
    body.className="messageBody";

    const role=document.createElement("div");
    role.className="role";
    role.textContent=m.role==="user"?"Вы":"Нейро-чат";

    const content=document.createElement("div");
    content.className="content";
    content.innerHTML=format(
      m.content ?? m.text ?? ""
    );

    body.append(role,content);
    article.append(avatar,body);

    root.appendChild(article);
  });

  scroll();
}

function scroll(){
  requestAnimationFrame(()=>{
    $("messages").scrollTop=$("messages").scrollHeight;
  });
}


/* SEND */

$("send").onclick=send;

$("input").addEventListener("keydown",e=>{
  if(e.key==="Enter"&&!e.shiftKey){
    e.preventDefault();
    send();
  }
});

async function send(){
  if(state.sending)return;

  const text=$("input").value.trim();

  if(!text&&!state.file)return;

  if(!state.user){
    open("authModal");
    return;
  }

  if(!state.activeChat){
    await $("newChat").click();
  }

  state.sending=true;
  $("send").disabled=true;

  let content=text;

  if(state.file){
    content +=
      `\n\n[Прикреплённый файл: ${state.file.name}]`;
  }

  $("input").value="";
  resize();

  state.messages.push({
    role:"user",
    content
  });

  renderMessages();

  const typing={
    role:"assistant",
    content:"…"
  };

  state.messages.push(typing);
  renderMessages();

  try{
    const messages=state.messages
      .filter(m=>m!==typing)
      .slice(-40)
      .map(m=>({
        role:m.role,
        content:m.content
      }));

    const data=await api("/api/chat",{
      method:"POST",
      body:JSON.stringify({
        chatId:state.activeChat,
        messages
      })
    });

    state.messages.pop();

    const answer=
      data.message ??
      data.response ??
      data.answer ??
      data.text ??
      data.content ??
      data.result?.response ??
      data.choices?.[0]?.message?.content;

    if(typeof answer!=="string"||!answer.trim()){
      throw new Error("AI не вернул текстовый ответ.");
    }

    state.messages.push({
      role:"assistant",
      content:answer
    });

    renderMessages();

  }catch(e){
    state.messages.pop();

    state.messages.push({
      role:"assistant",
      content:"⚠️ "+e.message
    });

    renderMessages();

  }finally{
    state.sending=false;
    $("send").disabled=false;
    clearFile();
    $("input").focus();
  }
}


/* MEDIA */

$("plus").onclick=()=>{
  $("fileInput").click();
};

$("fileInput").onchange=()=>{
  const file=$("fileInput").files[0];

  if(!file)return;

  state.file=file;

  $("preview").classList.add("show");

  $("preview").innerHTML=`
    <div class="previewItem">
      📎
      <span style="flex:1">${escape(file.name)}</span>
      <button id="removeFile"
        style="border:0;background:none;color:#aaa;font-size:18px">×</button>
    </div>
  `;

  $("removeFile").onclick=clearFile;
};

function clearFile(){
  state.file=null;
  $("fileInput").value="";
  $("preview").classList.remove("show");
  $("preview").innerHTML="";
}


/* TEXT SIZE */

$("input").addEventListener("input",resize);

function resize(){
  const el=$("input");
  el.style.height="auto";
  el.style.height=Math.min(el.scrollHeight,180)+"px";
}


/* IMAGE */

$("imageOpen").onclick=()=>{
  if(!state.user){
    open("authModal");
    return;
  }

  $("imageResult").innerHTML="";
  open("imageModal");
};

$("generateImage").onclick=async()=>{
  const prompt=$("imagePrompt").value.trim();

  if(!prompt)return;

  $("generateImage").disabled=true;
  $("generateImage").textContent="Создание…";

  try{
    const data=await api("/api/generate/image",{
      method:"POST",
      body:JSON.stringify({prompt})
    });

    const src=data.image||data.url;

    if(!src)throw new Error("Изображение не получено.");

    $("imageResult").innerHTML=
      `<img class="media" src="${src}" alt="Созданное изображение">`;

  }catch(e){
    $("imageResult").textContent=e.message;
  }finally{
    $("generateImage").disabled=false;
    $("generateImage").textContent="Создать";
  }
};


/* VIDEO */

$("videoOpen").onclick=()=>{
  if(!state.user){
    open("authModal");
    return;
  }

  $("videoResult").innerHTML="";
  open("videoModal");
};

$("generateVideo").onclick=async()=>{
  const prompt=$("videoPrompt").value.trim();

  if(!prompt)return;

  $("generateVideo").disabled=true;
  $("generateVideo").textContent="Создание…";

  try{
    const data=await api("/api/generate/video",{
      method:"POST",
      body:JSON.stringify({
        prompt,
        duration:Number($("videoDuration").value),
        aspect_ratio:"16:9",
        generate_audio:true
      })
    });

    const src=data.video||data.url;

    if(!src)throw new Error("Видео не получено.");

    $("videoResult").innerHTML=
      `<video class="media" controls playsinline src="${src}"></video>`;

  }catch(e){
    $("videoResult").textContent=e.message;
  }finally{
    $("generateVideo").disabled=false;
    $("generateVideo").textContent="Создать";
  }
};


/* LOGOUT */

$("logout").onclick=async()=>{
  try{
    await api("/api/auth/logout",{method:"POST"});
  }catch{}

  state.user=null;
  state.chats=[];
  state.activeChat=null;
  state.messages=[];

  close("profileModal");
  updateAccount();
  renderWelcome();
  renderChats();
};


/* MOBILE */

$("mobileMenu").onclick=()=>{
  $("sidebar").classList.toggle("open");
};


/* START */

renderWelcome();
checkSession();

</script>
</body>
