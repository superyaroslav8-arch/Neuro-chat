<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, viewport-fit=cover"
  >

  <title>Нейро — AI помощник</title>

  <link
    rel="stylesheet"
    href="style.css"
  >
</head>

<body>

  <!-- =====================
       AUTH
  ====================== -->

  <div
    id="auth"
    class="auth-screen"
  >

    <div class="auth-card">

      <div class="brand-mark">
        N
      </div>

      <h1>Нейро</h1>

      <p>
        Ваш интеллектуальный помощник
      </p>

      <form id="authForm">

        <input
          id="username"
          autocomplete="username"
          placeholder="Логин"
          required
        >

        <input
          id="password"
          type="password"
          autocomplete="current-password"
          placeholder="Пароль"
          required
        >

        <button
          class="primary"
          id="authSubmit"
          type="submit"
        >
          Войти
        </button>

        <button
          class="ghost"
          id="toggleAuth"
          type="button"
        >
          Создать аккаунт
        </button>

        <div
          id="authError"
          class="error"
        ></div>

      </form>

    </div>

  </div>


  <!-- =====================
       APP
  ====================== -->

  <div
    id="app"
    class="app hidden"
  >

    <aside
      class="sidebar"
      id="sidebar"
    >

      <div class="side-top">

        <button
          class="icon-btn"
          id="closeSide"
        >
          ×
        </button>

        <div class="logo">
          N
        </div>

        <button
          class="icon-btn"
          id="newChat"
          title="Новый чат"
        >
          ＋
        </button>

      </div>


      <div class="profile">

        <div class="avatar">
          N
        </div>

        <div>

          <b id="userName">
            Пользователь
          </b>

          <span>
            Нейро
          </span>

        </div>

      </div>


      <button
        class="new-chat"
        id="newChat2"
      >
        ＋ Новый чат
      </button>


      <div
        class="chat-list"
        id="chatList"
      ></div>


      <div class="side-bottom">

        <button id="logout">
          ↪ Выйти
        </button>

      </div>

    </aside>


    <main class="main">

      <header class="topbar">

        <button
          class="icon-btn mobile-only"
          id="openSide"
        >
          ☰
        </button>

        <div class="top-title">

          <strong>
            Нейро
          </strong>

          <span>
            Автономный режим
          </span>

        </div>

        <button
          class="icon-btn"
          id="clearChat"
          title="Очистить текущий чат"
        >
          ⌫
        </button>

      </header>


      <section
        class="conversation"
        id="conversation"
      >

        <div
          class="welcome"
          id="welcome"
        >

          <div class="hero-logo">
            N
          </div>

          <h2>
            Чем могу помочь?
          </h2>

          <p>
            Задай вопрос, напиши идею
            или пришли задачу.
          </p>


          <div class="suggestions">

            <button
              data-q="Помоги мне придумать идею для сайта"
            >
              💡 Идея для сайта
            </button>

            <button
              data-q="Помоги исправить мой JavaScript"
            >
              🧩 Исправить код
            </button>

            <button
              data-q="Расскажи, что ты умеешь"
            >
              ✨ Что ты умеешь?
            </button>

          </div>

        </div>

      </section>


      <div class="composer-wrap">

        <div class="quick-tools">

          <button data-tool="image">
            🖼️ Изображение
          </button>

          <button data-tool="video">
            🎬 Видео
          </button>

          <button data-tool="file">
            📎 Файл
          </button>

          <button data-tool="code">
            ⌘ Код
          </button>

        </div>


        <div class="composer">

          <textarea
            id="message"
            rows="1"
            placeholder="Сообщить Нейро..."
          ></textarea>

          <button
            class="send"
            id="send"
            aria-label="Отправить"
          >
            ↑
          </button>

        </div>


        <div class="hint">
          Нейро работает без внешнего API-ключа.
          Проверяй важные сведения перед использованием.
        </div>

      </div>

    </main>

  </div>


  <input
    id="fileInput"
    type="file"
    hidden
    multiple
  >

  <script src="script.js"></script>

</body>
</html>
