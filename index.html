<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

  <meta name="theme-color" content="#000000">
  <meta name="description" content="Нейро-чат — AI-помощник">

  <title>Нейро-чат</title>

  <link rel="icon" href="./site-icon.svg">
  <link rel="manifest" href="./site.webmanifest">

  <link rel="stylesheet" href="./style.css">
</head>

<body>

<div class="app">

  <!-- SIDEBAR -->
  <aside class="sidebar" id="sidebar">

    <div class="brand">
      <img src="./site-icon.svg" alt="Нейро-чат" class="logo">

      <div>
        <div class="brand-title">Нейро-чат</div>
        <div class="brand-subtitle">AI-помощник</div>
      </div>
    </div>

    <button class="new-chat" id="newChat">
      <span>＋</span>
      Новый чат
    </button>

    <div class="section-title">
      Чаты
    </div>

    <div class="chat-list" id="chatList">
      <div class="empty-chats">
        Пока нет чатов
      </div>
    </div>

    <div class="sidebar-bottom">

      <button class="side-button" id="toolsButton">
        ✦
        <span>Инструменты</span>
      </button>

      <button class="side-button" id="settingsButton">
        ⚙
        <span>Настройки</span>
      </button>

    </div>

  </aside>


  <!-- MAIN -->
  <main class="main">

    <header class="topbar">

      <button class="mobile-menu" id="mobileMenu">
        ☰
      </button>

      <div class="model">
        <span class="online-dot"></span>
        <span>Нейро AI</span>
      </div>

      <button class="temporary" id="temporaryButton">
        Временный чат
      </button>

    </header>


    <!-- CHAT -->
    <section class="chat">

      <div class="messages" id="messages">

        <div class="welcome" id="welcome">

          <img
            src="./site-icon.svg"
            class="welcome-logo"
            alt="Нейро-чат"
          >

          <h1>Нейро-чат</h1>

          <p>
            Твой AI-помощник
          </p>

          <div class="suggestions">

            <button data-prompt="Объясни мне сложную тему простыми словами">
              <strong>Объяснить</strong>
              <span>Сложную тему простыми словами</span>
            </button>

            <button data-prompt="Помоги мне написать код">
              <strong>Написать код</strong>
              <span>Создать или исправить программу</span>
            </button>

            <button data-prompt="Помоги придумать идею для проекта">
              <strong>Придумать идею</strong>
              <span>Для проекта или работы</span>
            </button>

            <button data-prompt="Помоги мне создать сайт">
              <strong>Создать сайт</strong>
              <span>Продумать структуру и код</span>
            </button>

          </div>

        </div>

      </div>


      <!-- COMPOSER -->
      <div class="composer-wrap">

        <div class="composer">

          <button
            class="attach"
            id="attachButton"
            title="Прикрепить файл"
          >
            ＋
          </button>

          <input
            type="file"
            id="fileInput"
            hidden
            multiple
          >

          <textarea
            id="messageInput"
            rows="1"
            placeholder="Напишите сообщение Нейро..."
            autocomplete="off"
          ></textarea>

          <button
            class="voice"
            id="voiceButton"
            title="Голосовой ввод"
          >
            🎙
          </button>

          <button
            class="send"
            id="sendButton"
            title="Отправить"
          >
            ↑
          </button>

        </div>

        <div class="composer-note">
          Нейро-чат может ошибаться. Проверяй важную информацию.
        </div>

      </div>

    </section>

  </main>

</div>


<!-- TOAST -->
<div class="toast" id="toast"></div>


<!-- SETTINGS -->
<div class="modal hidden" id="settingsModal">

  <div class="modal-box">

    <button class="modal-close" data-close="settingsModal">
      ×
    </button>

    <h2>Настройки</h2>

    <label class="setting">
      <span>
        <strong>Временные чаты</strong>
        <small>Не сохранять историю</small>
      </span>

      <input type="checkbox" id="temporarySetting">
    </label>

    <button class="primary-button" id="saveSettings">
      Сохранить
    </button>

  </div>

</div>


<!-- TOOLS -->
<div class="modal hidden" id="toolsModal">

  <div class="modal-box">

    <button class="modal-close" data-close="toolsModal">
      ×
    </button>

    <h2>Инструменты</h2>

    <div class="tools">

      <button data-tool="image">
        🖼️
        <strong>Изображение</strong>
        <span>Подготовить запрос для изображения</span>
      </button>

      <button data-tool="video">
        🎬
        <strong>Видео</strong>
        <span>Подготовить сценарий</span>
      </button>

      <button data-tool="code">
        </> 
        <strong>Код</strong>
        <span>Создать или исправить код</span>
      </button>

      <button data-tool="website">
        🌐
        <strong>Сайт</strong>
        <span>Спроектировать сайт</span>
      </button>

      <button data-tool="3d">
        🧊
        <strong>3D-модель</strong>
        <span>Подготовить описание модели</span>
      </button>

    </div>

  </div>

</div>


<script src="./script.js" defer></script>

</body>
</html>
