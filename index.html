<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#000000">
  <meta name="description" content="Нейро-чат — универсальный AI-чат с выбором модели.">
  <title>Нейро-чат</title>

  <link rel="stylesheet" href="style.css">
  <link rel="manifest" href="site.webmanifest">
</head>

<body>
  <div id="app" class="app">

    <!-- Боковая панель -->
    <aside id="sidebar" class="sidebar" aria-label="Боковая панель">

      <div class="sidebar__top">
        <button
          id="newChatButton"
          class="icon-button"
          type="button"
          aria-label="Новый чат"
          title="Новый чат"
        >
          +
        </button>

        <button
          id="closeSidebarButton"
          class="icon-button sidebar__close"
          type="button"
          aria-label="Закрыть меню"
          title="Закрыть меню"
        >
          ×
        </button>
      </div>

      <nav class="chat-list" aria-label="История чатов">
        <button
          id="historyEmpty"
          class="history-empty"
          type="button"
          hidden
        >
          Чатов пока нет
        </button>
      </nav>

      <div class="sidebar__bottom">
        <button
          id="settingsButton"
          class="sidebar-action"
          type="button"
        >
          Настройки
        </button>

        <button
          id="profileButton"
          class="sidebar-action"
          type="button"
        >
          Профиль
        </button>
      </div>

    </aside>

    <!-- Основная область -->
    <main class="main-content">

      <!-- Верхняя панель -->
      <header class="topbar">

        <button
          id="openSidebarButton"
          class="icon-button topbar__menu"
          type="button"
          aria-label="Открыть меню"
          title="Открыть меню"
        >
          ☰
        </button>

        <div
          class="brand"
          aria-label="Нейро-чат"
        >
          Нейро-чат
        </div>

        <button
          id="accountButton"
          class="account-button"
          type="button"
          aria-label="Аккаунт"
        >
          Войти
        </button>

      </header>

      <!-- Главный экран -->
      <section
        id="homeScreen"
        class="home-screen"
        aria-label="Главный экран"
      >

        <div class="home-content">
          <h1>Нейро-чат</h1>

          <p>
            Задайте вопрос, загрузите файл или выберите модель.
          </p>
        </div>

        <!-- Поле ввода на главном экране -->
        <form
          id="composerForm"
          class="composer composer--home"
          autocomplete="off"
        >

          <div class="composer__tools">

            <button
              id="attachButton"
              class="composer-button"
              type="button"
              aria-label="Прикрепить файл"
              title="Прикрепить файл"
            >
              +
            </button>

            <input
              id="fileInput"
              type="file"
              hidden
            >

            <!-- Выбор модели -->
            <button
              id="modelButton"
              class="model-button"
              type="button"
              aria-haspopup="listbox"
              aria-expanded="false"
            >
              <span id="selectedModelLabel">
                Нейро
              </span>

              <span aria-hidden="true">
                ⌄
              </span>
            </button>

            <div
              id="modelMenu"
              class="model-menu"
              role="listbox"
              aria-label="Выбор модели"
              hidden
            >

              <button
                class="model-option is-selected"
                type="button"
                role="option"
                aria-selected="true"
                data-model="neuro"
              >
                Нейро
              </button>

              <button
                class="model-option"
                type="button"
                role="option"
                aria-selected="false"
                data-model="chatgpt"
              >
                ChatGPT
              </button>

              <button
                class="model-option"
                type="button"
                role="option"
                aria-selected="false"
                data-model="gemini"
              >
                Gemini
              </button>

              <button
                class="model-option"
                type="button"
                role="option"
                aria-selected="false"
                data-model="grok"
              >
                Grok
              </button>

              <button
                class="model-option"
                type="button"
                role="option"
                aria-selected="false"
                data-model="alice-1"
              >
                Алиса 1
              </button>

            </div>

          </div>

          <textarea
            id="messageInput"
            name="message"
            rows="1"
            maxlength="12000"
            placeholder="Сообщение для Нейро-чат..."
            aria-label="Сообщение"
          ></textarea>

          <div class="composer__actions">

            <button
              id="voiceButton"
              class="composer-button"
              type="button"
              aria-label="Голосовой ввод"
              title="Голосовой ввод"
            >
              🎙
            </button>

            <button
              id="sendButton"
              class="send-button"
              type="submit"
              aria-label="Отправить сообщение"
              title="Отправить"
            >
              ↑
            </button>

          </div>

        </form>

      </section>

      <!-- Экран чата -->
      <section
        id="chatScreen"
        class="chat-screen"
        aria-label="Чат"
        hidden
      >

        <div
          id="messages"
          class="messages"
          aria-live="polite"
          aria-relevant="additions text"
        ></div>

        <form
          id="chatComposerForm"
          class="composer composer--chat"
          autocomplete="off"
        >

          <div class="composer__tools">

            <button
              id="chatAttachButton"
              class="composer-button"
              type="button"
              aria-label="Прикрепить файл"
              title="Прикрепить файл"
            >
              +
            </button>

            <input
              id="chatFileInput"
              type="file"
              hidden
            >

            <button
              id="chatModelButton"
              class="model-button"
              type="button"
              aria-haspopup="listbox"
              aria-expanded="false"
            >
              <span id="chatSelectedModelLabel">
                Нейро
              </span>

              <span aria-hidden="true">
                ⌄
              </span>
            </button>

          </div>

          <textarea
            id="chatMessageInput"
            name="message"
            rows="1"
            maxlength="12000"
            placeholder="Сообщение..."
            aria-label="Сообщение"
          ></textarea>

          <div class="composer__actions">

            <button
              id="chatVoiceButton"
              class="composer-button"
              type="button"
              aria-label="Голосовой ввод"
              title="Голосовой ввод"
            >
              🎙
            </button>

            <button
              id="chatSendButton"
              class="send-button"
              type="submit"
              aria-label="Отправить сообщение"
              title="Отправить"
            >
              ↑
            </button>

          </div>

        </form>

      </section>

    </main>

  </div>

  <!-- Авторизация -->
  <div
    id="authModal"
    class="modal"
    hidden
  >

    <div
      class="modal__backdrop"
      data-close-modal="authModal"
    ></div>

    <section
      class="modal__card"
      role="dialog"
      aria-modal="true"
      aria-labelledby="authTitle"
    >

      <button
        class="modal__close"
        type="button"
        data-close-modal="authModal"
        aria-label="Закрыть"
      >
        ×
      </button>

      <h2 id="authTitle">
        Войти в Нейро-чат
      </h2>

      <p id="authDescription">
        Введите имя пользователя и пароль.
      </p>

      <div
        class="auth-tabs"
        role="tablist"
        aria-label="Авторизация"
      >

        <button
          id="loginTab"
          class="auth-tab is-active"
          type="button"
          role="tab"
          aria-selected="true"
        >
          Войти
        </button>

        <button
          id="registerTab"
          class="auth-tab"
          type="button"
          role="tab"
          aria-selected="false"
        >
          Регистрация
        </button>

      </div>

      <form
        id="authForm"
        autocomplete="on"
      >

        <label for="usernameInput">
          Имя пользователя
        </label>

        <input
          id="usernameInput"
          name="username"
          type="text"
          autocomplete="username"
          minlength="3"
          maxlength="32"
          required
        >

        <label for="passwordInput">
          Пароль
        </label>

        <input
          id="passwordInput"
          name="password"
          type="password"
          autocomplete="current-password"
          minlength="6"
          maxlength="128"
          required
        >

        <div
          id="confirmPasswordGroup"
          hidden
        >

          <label for="confirmPasswordInput">
            Повторите пароль
          </label>

          <input
            id="confirmPasswordInput"
            name="confirmPassword"
            type="password"
            autocomplete="new-password"
            minlength="6"
            maxlength="128"
          >

        </div>

        <p
          id="authError"
          class="form-error"
          role="alert"
          hidden
        ></p>

        <button
          id="authSubmitButton"
          class="primary-button"
          type="submit"
        >
          Войти
        </button>

      </form>

    </section>

  </div>

  <!-- Настройки -->
  <div
    id="settingsModal"
    class="modal"
    hidden
  >

    <div
      class="modal__backdrop"
      data-close-modal="settingsModal"
    ></div>

    <section
      class="modal__card"
      role="dialog"
      aria-modal="true"
      aria-labelledby="settingsTitle"
    >

      <button
        class="modal__close"
        type="button"
        data-close-modal="settingsModal"
        aria-label="Закрыть"
      >
        ×
      </button>

      <h2 id="settingsTitle">
        Настройки
      </h2>

      <div class="settings-list">

        <button
          id="temporaryChatButton"
          class="settings-item"
          type="button"
          aria-pressed="false"
        >
          <span>
            Временный чат
          </span>

          <span id="temporaryChatState">
            Выключен
          </span>
        </button>

      </div>

    </section>

  </div>

  <!-- Профиль -->
  <div
    id="profileModal"
    class="modal"
    hidden
  >

    <div
      class="modal__backdrop"
      data-close-modal="profileModal"
    ></div>

    <section
      class="modal__card"
      role="dialog"
      aria-modal="true"
      aria-labelledby="profileTitle"
    >

      <button
        class="modal__close"
        type="button"
        data-close-modal="profileModal"
        aria-label="Закрыть"
      >
        ×
      </button>

      <h2 id="profileTitle">
        Профиль
      </h2>

      <p id="profileUsername">
        Вы не вошли.
      </p>

      <button
        id="logoutButton"
        class="secondary-button"
        type="button"
      >
        Выйти
      </button>

    </section>

  </div>

  <!-- Уведомления -->
  <div
    id="toast"
    class="toast"
    role="status"
    aria-live="polite"
    hidden
  ></div>

  <script src="script.js" defer></script>
</body>
</html>
